<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendify · Agenda piloto</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="hero"><div class="wrap"><span class="mark">✦ Agendify</span><h1>Agenda clara, día a día.</h1><p>Organizá turnos por sede y profesional.</p></div></header>
  <main class="wrap">
    <p class="warning" role="note">Piloto local solo para pacientes sintéticos. No apto para uso clínico ni datos reales.</p>
    <div id="message" role="status" aria-live="polite"></div>
    <section class="panel" aria-labelledby="agenda-title"><h2 id="agenda-title">Agenda del día</h2>
      <div class="filters"><label>Fecha <input id="date" type="date" required></label><label>Sede <select id="site"></select></label></div>
      <div id="appointments" aria-live="polite"></div>
    </section>
    <section class="panel" aria-labelledby="booking-title"><h2 id="booking-title">Nuevo turno</h2>
      <form id="booking"><label>Profesional <select id="professional" required></select></label>
        <label>Horario (turnos de 30 minutos) <select id="time" required></select></label>
        <label>Nombre sintético <input name="patientName" maxlength="120" required autocomplete="off" placeholder="Ej.: Paciente de prueba"></label>
        <label>Servicio <input name="service" maxlength="120" required placeholder="Ej.: Consulta de prueba"></label>
        <button type="submit">Confirmar turno</button></form>
    </section>
  </main>
</body>
</html>

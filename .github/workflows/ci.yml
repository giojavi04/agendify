name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Ephemeral runner; no hosted project or production credentials.
      - name: Start isolated local Supabase without logging generated keys
        run: |
          if ! supabase start >/dev/null 2>&1; then
            echo 'Local Supabase failed to start'
            exit 1
          fi
      - run: supabase test db
      - run: supabase db lint --local
